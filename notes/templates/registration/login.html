<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · AI Notes Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 460px">
      <div class="card-body p-4 p-md-5">
        <a class="text-decoration-none small" href="{% url 'home' %}">← AI Notes Summarizer</a>
        <h1 class="h3 mt-3">Welcome back</h1>
        <p class="text-secondary">Log in to access your notes and summaries.</p>
        {% if form.errors %}<div class="alert alert-danger">The username or password was not recognized.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
            <input class="form-control" type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
            <input class="form-control" type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="small text-center mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
      </div>
    </div>
  </main>
</body>
</html>
